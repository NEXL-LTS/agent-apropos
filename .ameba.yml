# Ameba configuration — https://github.com/crystal-ameba/ameba
# Zero findings is a CI gate. Keep this minimal: add a rule override
# only with a comment recording the judgment call behind it. Guidance that
# ameba cannot enforce lives in docs/conventions/ (the incubator principle).
Globs:
  - "src/**/*.cr"
  - "spec/**/*.cr"

Excluded:
  - lib
  - bin

# Apropos/CommentBlock is a custom rule (tool/lint/), not part of upstream
# ameba, run via `bin/ameba-apropos` — see `make lint`. Scoped to src only
# (docs/conventions/comments.md governs src, not spec).
Apropos/CommentBlock:
  Enabled: true
  Excluded:
    - "spec/**/*.cr"
