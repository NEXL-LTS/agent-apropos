name: Release

on:
  push:
    tags: ["v*"]
  # Lets a maintainer exercise the full build/link/sign/verify pipeline on any
  # branch via `gh workflow run release.yml --ref <branch>` (or the Actions UI)
  # without creating a tag or a GitHub Release — the release-attach step below
  # is gated to tag pushes, and every leg uploads its binary as a workflow
  # artifact so it can be downloaded and sanity-checked by hand.
  workflow_dispatch: {}

permissions: {}

# Roadmap leg (disabled until its own CI is green):
#   - Windows x86_64 (Crystal Windows support is Preview — no production promise)
jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: agent-apropos-linux-x86_64, runner: ubuntu-latest }
          # Native arm64 runner (free on public repos) rather than QEMU
          # emulation under docker run — same static-musl build, just a
          # different host architecture, and Docker pulls the matching
          # crystallang/crystal:1.20-alpine manifest automatically.
          - { name: agent-apropos-linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # create the release and upload the built assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build fully static against musl inside the Crystal Alpine image. Using
      # `docker run` (rather than a job `container:`) keeps checkout and the
      # release Action on the host, where Node is available.
      - name: Build static binary (musl/alpine)
        run: |
          docker run --rm -v "$PWD":/w -w /w crystallang/crystal:1.20-alpine sh -c '
            set -e
            shards install --production
            crystal build --release --static src/agent_apropos.cr -o ${{ matrix.name }}
          '

      - name: Verify static linkage
        run: |
          file ${{ matrix.name }}
          # A fully static binary reports "not a dynamic executable".
          ldd ${{ matrix.name }} 2>&1 | grep -q "not a dynamic executable" \
            || { echo "ERROR: binary is not fully static"; exit 1; }

      - name: Smoke test
        # Crystal's compiler output is already executable (0755); skip chmod
        # here — the binary was built by `docker run` as root, so the
        # non-root runner user can't chmod a file it doesn't own.
        run: ./${{ matrix.name }} --version

      - name: Checksum
        run: sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256

      # Exercises install.sh's real platform-detection/download/checksum/install
      # logic end-to-end against this leg's own freshly built artifact, without
      # needing a published release or any real networking: curl/wget both
      # support file:// URLs, so a local directory stands in for GitHub at the
      # same relative path install.sh requests, with zero code changes to it.
      - name: Test install.sh against this artifact
        run: |
          set -e
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/serve/NEXL-LTS/agent-apropos/releases/latest/download"
          cp ${{ matrix.name }} ${{ matrix.name }}.sha256 \
            "$workdir/serve/NEXL-LTS/agent-apropos/releases/latest/download/"
          sed "s#https://github.com#file://$workdir/serve#" install.sh > "$workdir/install.sh"
          AGENT_APROPOS_BIN_DIR="$workdir/bin" sh "$workdir/install.sh"
          "$workdir/bin/agent-apropos" --version

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        # zizmor: ignore[superfluous-actions] the matrix legs attach to a
        # single release; this action handles the create-or-update race that a
        # hand-rolled `gh release` script would not.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Apple Silicon runner (arm64 is macos-latest since Aug 2025).
          - { name: agent-apropos-darwin-arm64, runner: macos-15 }
          # GitHub's last committed Intel macOS image; retires ~Aug 2027 as
          # Apple/GitHub phase out x86_64 macOS runners entirely.
          - { name: agent-apropos-darwin-x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # create the release and upload the built assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: 1.20.3

      # macOS has no static libc (Apple doesn't ship one), so a fully static
      # binary like the Linux legs isn't possible here. Instead, statically
      # link the third-party deps Crystal's stdlib pulls in via their
      # Homebrew .a archives, so the shipped binary depends on nothing beyond
      # macOS system frameworks — no Homebrew required on the installing
      # machine. `digest/sha256` (used to hash convention doc contents) is
      # backed by OpenSSL's libcrypto in Crystal's stdlib, and Crystal's own
      # codegen resolves that dependency via pkg-config to Homebrew's dylib *before*
      # our --link-flags are even considered — a plain positional .a path
      # loses that race. `-Wl,-force_load` unconditionally embeds the static
      # archive regardless of link order, and `-Wl,-dead_strip_dylibs` then
      # drops Crystal's now-redundant dynamic reference.
      - name: Build (static third-party libs, dynamic system libs)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -e
          brew install libyaml pcre2 bdw-gc libevent openssl@3
          shards install --production
          unset PKG_CONFIG_PATH
          # `brew --prefix` (no formula) is a fixed path with no lookup noise;
          # every formula gets a `$prefix/opt/<name>` symlink regardless of
          # version, so this avoids `brew --prefix <formula>` output (which
          # can be polluted by unrelated tap/update warnings on stdout).
          brew_prefix="$(brew --prefix)"
          yaml_lib="$brew_prefix/opt/libyaml/lib/libyaml.a"
          pcre2_lib="$brew_prefix/opt/pcre2/lib/libpcre2-8.a"
          gc_lib="$brew_prefix/opt/bdw-gc/lib/libgc.a"
          event_lib="$brew_prefix/opt/libevent/lib/libevent.a"
          ssl_lib="$brew_prefix/opt/openssl@3/lib/libssl.a"
          crypto_lib="$brew_prefix/opt/openssl@3/lib/libcrypto.a"
          # Fail fast with a clear error if a path is wrong, rather than a
          # confusing link (or silent dynamic-fallback) failure below.
          ls -l "$yaml_lib" "$pcre2_lib" "$gc_lib" "$event_lib" "$ssl_lib" "$crypto_lib"
          crystal build --release \
            --link-flags "$yaml_lib $pcre2_lib $gc_lib $event_lib -Wl,-force_load,$ssl_lib -Wl,-force_load,$crypto_lib -Wl,-dead_strip_dylibs" \
            src/agent_apropos.cr -o ${{ matrix.name }}

      # Proves the static link actually worked, rather than merely appearing
      # to because this runner happens to already have these exact libs at
      # their exact expected paths: remove them before anything below tries
      # to run the binary. `crystal` itself (used above) may depend on some
      # of these, hence --ignore-dependencies — we're done needing it.
      - name: Remove the Homebrew libs used for static linking
        run: brew uninstall --ignore-dependencies libyaml pcre2 bdw-gc libevent openssl@3

      # Apple Silicon's kernel refuses to run an executable with no code
      # signature at all (SIGKILL), independent of Gatekeeper/notarization.
      # An ad-hoc signature (no certificate, no Apple Developer account)
      # satisfies that check; it does not satisfy Gatekeeper's quarantine
      # check for browser-downloaded files, but `curl`-based installs (this
      # project's install.sh included) never set the quarantine attribute.
      - name: Ad-hoc code sign
        run: codesign --force --sign - ${{ matrix.name }}

      - name: Verify linkage
        run: |
          file ${{ matrix.name }}
          # The static libs above must not show up as dylibs; only macOS
          # system paths (/usr/lib, /System/...) should remain.
          if otool -L ${{ matrix.name }} | tail -n +2 | grep -viq -e '/usr/lib/' -e '/System/'; then
            echo "ERROR: binary links a non-system dylib (a Homebrew dep leaked in dynamically):"
            otool -L ${{ matrix.name }}
            exit 1
          fi

      - name: Smoke test
        run: |
          chmod +x ${{ matrix.name }}
          ./${{ matrix.name }} --version

      - name: Checksum
        run: shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256

      # Exercises install.sh's real platform-detection/download/checksum/install
      # logic end-to-end against this leg's own freshly built artifact, without
      # needing a published release or any real networking: curl/wget both
      # support file:// URLs, so a local directory stands in for GitHub at the
      # same relative path install.sh requests, with zero code changes to it.
      - name: Test install.sh against this artifact
        run: |
          set -e
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/serve/NEXL-LTS/agent-apropos/releases/latest/download"
          cp ${{ matrix.name }} ${{ matrix.name }}.sha256 \
            "$workdir/serve/NEXL-LTS/agent-apropos/releases/latest/download/"
          sed "s#https://github.com#file://$workdir/serve#" install.sh > "$workdir/install.sh"
          # /usr/bin first: on this runner PATH resolves `curl` to Homebrew's
          # own build, which (unlike Apple's system curl) dynamically depends
          # on the openssl@3 just uninstalled above — force Apple's curl so
          # this step tests *our* binary's portability, not Homebrew's.
          PATH="/usr/bin:/bin:$PATH" AGENT_APROPOS_BIN_DIR="$workdir/bin" sh "$workdir/install.sh"
          "$workdir/bin/agent-apropos" --version

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        # zizmor: ignore[superfluous-actions] the matrix legs attach to a
        # single release; this action handles the create-or-update race that a
        # hand-rolled `gh release` script would not.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256
