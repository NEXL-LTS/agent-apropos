name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# The spec/lint/coverage job runs on ubuntu-latest via
# the install-crystal action rather than the crystallang/crystal:alpine
# container, because kcov (the coverage gate) needs a full glibc userland and
# ptrace — neither of which the Alpine build image provides cleanly. Ubuntu
# 24.04 (noble) DROPPED the `kcov` apt package, so kcov is built from a pinned
# release here (mirroring .devcontainer/Dockerfile). GitHub's runner VM allows
# ptrace + personality() without the seccomp relaxation the local devcontainer
# needs. The static musl build still uses Alpine — in release.yml, via
# `docker run` (the Crystal Alpine image ships no Node, which breaks JS-based
# Actions run *inside* a container).

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: 1.20.3

      - name: Install dependencies
        run: shards install

      - name: Format check
        run: crystal tool format --check

      - name: Lint (ameba, zero findings)
        run: ./bin/ameba

      # Apropos/CommentBlock (tool/lint/) isn't an upstream ameba rule, so it
      # ships as its own binary rather than a .ameba.yml plugin entry.
      - name: Build apropos ameba rules
        run: crystal build tool/lint/main.cr -o bin/ameba-apropos

      - name: Lint (apropos rules, zero findings)
        run: ./bin/ameba-apropos

      - name: Specs
        run: crystal spec

      - name: Install coverage tooling (jq + kcov from source)
        env:
          KCOV_VERSION: v43
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq cmake binutils-dev libcurl4-openssl-dev libdw-dev libelf-dev libiberty-dev python3
          git clone --depth 1 --branch "$KCOV_VERSION" \
            https://github.com/SimonKagstrom/kcov.git /tmp/kcov
          cmake -S /tmp/kcov -B /tmp/kcov/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/kcov/build --parallel "$(nproc)"
          sudo cmake --install /tmp/kcov/build
          rm -rf /tmp/kcov

      - name: Coverage (100% line gate)
        run: ./scripts/coverage.sh

      - name: Unreachable-code check (paired with coverage)
        run: crystal tool unreachable src/agent_apropos.cr

      - name: Release smoke build
        run: crystal build --release src/agent_apropos.cr -o bin/agent-apropos

      # Self-check: the repo dogfoods the standard, so the built
      # binary must find its own generated skill wrappers byte-identical and its
      # own convention docs lint-clean. This is the drift gate against a
      # hand-edited SKILL.md or a malformed rule doc landing on main.
      - name: Self-check (generate --check && lint)
        run: |
          ./bin/agent-apropos generate --check
          ./bin/agent-apropos lint

  # Windows is a CI-verified runtime target, not a development environment: this
  # leg builds the release binary and runs the spec suite, and deliberately
  # leaves kcov coverage, jscpd and the bats suites to the Linux `test` job,
  # which stays authoritative for the 100% gate. The bar is the spec run rather
  # than a `--version` smoke check, because the Windows-only defects this leg
  # exists to catch — a CRLF checkout changing a doc hash, a backslash pattern
  # silently matching nothing in Dir.glob — both pass a build and fail a spec.
  #
  # Pinned to the same Crystal version as the `test` job. Crystal rates
  # x86_64-windows-msvc Tier 3, so a version bump is the likeliest source of
  # divergence between the two legs.
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: 1.20.3

      # Not `--production`: `crystal spec` below compiles spec/tool, which
      # requires ameba, so this leg genuinely needs the dev dependency.
      - name: Install dependencies
        run: shards install

      # Statically linked, like the Linux musl legs: the dynamic Windows build
      # pulls in yaml.dll, libcrypto-3-x64.dll, pcre2-8.dll, gc.dll and
      # iconv-2.dll, none of which a stock Windows machine has.
      #
      # `crystal build` does not create its output directory, and bin/ is
      # gitignored — so create it rather than depending on ameba's postinstall
      # build having happened to make it first.
      - name: Release build (static)
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          crystal build --release --static src/agent_apropos.cr -o bin/agent-apropos.exe

      - name: Smoke test
        run: ./bin/agent-apropos.exe --version

      # install.ps1's happy path was previously exercised only by release.yml's
      # tagged run, so a staging bug in it could not fail a PR — it failed the
      # release. Run it here too, against this leg's own build: the script
      # copies a file:// URI instead of requesting one, so a local directory
      # stands in for GitHub at the same relative path.
      - name: Test install.ps1 against this build
        shell: pwsh
        run: |
          $asset = 'agent-apropos-windows-x86_64.exe'
          $work = Join-Path $env:RUNNER_TEMP 'installer-selftest'
          $serve = Join-Path $work 'serve/NEXL-LTS/agent-apropos/releases/latest/download'
          New-Item -ItemType Directory -Force -Path $serve | Out-Null
          Copy-Item -LiteralPath 'bin/agent-apropos.exe' -Destination (Join-Path $serve $asset) -Force
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $serve $asset)).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $serve "$asset.sha256"), "$hash  $asset`n")
          $local = Join-Path $work 'install.ps1'
          (Get-Content install.ps1 -Raw).Replace(
            'https://github.com', 'file:///' + ($work -replace '\\','/') + '/serve') |
            Set-Content -Path $local
          $env:AGENT_APROPOS_BIN_DIR = Join-Path $work 'bin'
          & $local
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          & (Join-Path $env:AGENT_APROPOS_BIN_DIR 'agent-apropos.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "installed binary failed to run" }
          if (Test-Path (Join-Path $env:AGENT_APROPOS_BIN_DIR 'agent-apropos.new.exe')) {
            throw "install.ps1 left its staging file behind"
          }

      - name: Specs
        run: crystal spec

      # Self-check: the repo dogfoods the standard, so the Windows binary must
      # agree byte-for-byte with the Linux one about its own generated wrappers.
      # This is the drift gate for the line-ending normalization.
      # PowerShell does not stop a multi-command block on a non-zero native
      # exit, and the step inherits only the last one — so the drift gate has
      # to be checked explicitly or a stale wrapper would pass here.
      - name: Self-check (generate --check && lint)
        run: |
          ./bin/agent-apropos.exe generate --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./bin/agent-apropos.exe lint

  # Validates that markdown links and heading anchors across the committed docs
  # (README.md, AGENTS.md, docs/, e2e/README.md, e2e/conventions/) actually resolve.
  # Uses remark-validate-links via the pinned devDependencies in package.json —
  # separate from the Crystal toolchain above, so it gets its own job rather than
  # bolting Node onto the `test` job.
  docs-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation links
        run: npm run lint:docs

  # Fails the build on any duplicated code in src/**/*.cr (see .jscpd.json).
  # Uses the pinned npm devDependency (same version as .devcontainer/Dockerfile's
  # global install) rather than the Crystal toolchain, so it gets its own job —
  # same reasoning as docs-links above.
  duplication:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for code duplication (src/**/*.cr)
        run: npm run lint:dup

  # docs/plans/ is scratch space for in-flight plan documents: a plan is written,
  # implemented, and then deleted in the PR that lands the work. This gate fails
  # the build if one is committed, so a stale plan can't sit on main describing a
  # design the merged code has already moved past. It reads the git index, not the
  # working tree, so an untracked plan on a contributor's machine is unaffected.
  #
  # Its own job because it needs none of the Crystal toolchain — bolted onto
  # `test` the gate would wait on the compiler install and the coverage run.
  plans:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check no plan doc is committed under docs/plans/
        run: ./scripts/check-plans-empty.sh

      # The gate's own bats suite runs here too, so a change to it is covered by
      # the same job it guards. Ubuntu ships an older bats without
      # bats_load_library and no helper libraries, so both come from pinned
      # releases — the same versions .devcontainer/Dockerfile installs, keeping
      # CI and the devcontainer on one bats.
      - name: Install bats and its helper libraries
        env:
          BATS_CORE_VERSION: v1.11.1
          BATS_SUPPORT_VERSION: v0.3.0
          BATS_ASSERT_VERSION: v2.1.0
        run: |
          git clone --depth 1 --branch "$BATS_CORE_VERSION" \
            https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          rm -rf /tmp/bats-core
          sudo mkdir -p /usr/local/lib/bats
          sudo git clone --depth 1 --branch "$BATS_SUPPORT_VERSION" \
            https://github.com/bats-core/bats-support.git /usr/local/lib/bats/bats-support
          sudo git clone --depth 1 --branch "$BATS_ASSERT_VERSION" \
            https://github.com/bats-core/bats-assert.git /usr/local/lib/bats/bats-assert

      # Via make, so CI and a contributor's `make plans-spec` can't drift.
      - name: Spec (scripts/check-plans-empty.sh)
        run: make plans-spec

  # Mutation gate: fails the build when a mutant survives on the lines this PR
  # changed. Line coverage proves a line ran; this proves a spec noticed what it
  # did. Its own job because it needs the Crystal toolchain but none of the
  # coverage stack — bolted onto `test` its failure would be buried behind kcov.
  #
  # Pull requests only: the runner derives its line set from the merge-base of
  # the PR base and head, and a push to the default branch has no such base.
  # Ubuntu only, like the coverage gate; the Windows leg is unchanged.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history: the gate needs the merge-base of the PR base and head,
      # which a shallow clone does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: 1.20.3

      - name: Install dependencies
        run: shards install

      # Same pin, same flags as .devcontainer/Dockerfile — see
      # tool/mutate/requirements.txt for why --no-deps is deliberate.
      - name: Install the mutation engine
        run: |
          python3 -m venv "$RUNNER_TEMP/mutate"
          "$RUNNER_TEMP/mutate/bin/pip" install --no-cache-dir --require-hashes --no-deps \
            -r tool/mutate/requirements.txt
          echo "$RUNNER_TEMP/mutate/bin" >> "$GITHUB_PATH"

      # bats and its helper libraries, same pinned versions as the `plans` job
      # and .devcontainer/Dockerfile.
      - name: Install bats and its helper libraries
        env:
          BATS_CORE_VERSION: v1.11.1
          BATS_SUPPORT_VERSION: v0.3.0
          BATS_ASSERT_VERSION: v2.1.0
        run: |
          git clone --depth 1 --branch "$BATS_CORE_VERSION" \
            https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          rm -rf /tmp/bats-core
          sudo mkdir -p /usr/local/lib/bats
          sudo git clone --depth 1 --branch "$BATS_SUPPORT_VERSION" \
            https://github.com/bats-core/bats-support.git /usr/local/lib/bats/bats-support
          sudo git clone --depth 1 --branch "$BATS_ASSERT_VERSION" \
            https://github.com/bats-core/bats-assert.git /usr/local/lib/bats/bats-assert

      # The rules' own suite: it needs the engine and the compiler, so this is
      # the only job that can run it. The runner's stub-driven suite runs in
      # `make check` and needs neither.
      - name: Spec (tool/mutate/crystal.rules)
        run: make mutate-rules-spec

      - name: Mutation gate (changed lines)
        run: ./scripts/mutate.sh

  # Build the devcontainer image so a change to .devcontainer/Dockerfile (e.g.
  # the crystal/kcov/bats toolchain) can't break the dev environment unnoticed.
  # The image is loaded and smoke-checked to confirm the tools it installs are
  # actually on PATH and wired up (BATS_LIB_PATH in particular).
  devcontainer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build devcontainer image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: agent-apropos-devcontainer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-check the installed toolchain
        run: |
          docker run --rm agent-apropos-devcontainer:ci bash -c '
            set -e
            crystal --version
            shards --version
            kcov --version
            bats --version
            jq --version
            jscpd --version
            mutate --help > /dev/null
            echo "BATS_LIB_PATH=$BATS_LIB_PATH"
            test -f "$BATS_LIB_PATH/bats-support/load.bash"
            test -f "$BATS_LIB_PATH/bats-assert/load.bash"
          '
