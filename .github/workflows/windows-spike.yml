# TEMPORARY diagnostic spike — U1 of docs/plans/2026-08-22-1038-feat-windows-support-plan.md.
#
# Delete this whole file before merging. Its only deliverable is a findings
# report: what the Crystal Windows toolchain can and cannot do with this tree.
# Every step is continue-on-error so one failure does not hide the next.
#
# The plan called for a `workflow_dispatch` job in ci.yml, but GitHub only
# dispatches a workflow whose default-branch copy already declares that
# trigger, and ci.yml on main does not. A push trigger scoped to this branch
# fires from the branch itself, which is the same diagnostic with a mechanism
# that actually runs.
name: Windows toolchain spike (temporary)

on:
  push:
    branches: [claude/plan-windows-support]

permissions: {}

jobs:
  spike:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: 1.20.3

      - name: Toolchain versions
        continue-on-error: true
        run: |
          crystal --version
          shards --version

      - name: Install dependencies
        continue-on-error: true
        run: shards install

      - name: Build the binary (dynamic)
        continue-on-error: true
        run: crystal build src/agent_apropos.cr -o agent-apropos.exe --verbose

      - name: Build the binary (static)
        continue-on-error: true
        run: crystal build src/agent_apropos.cr -o agent-apropos-static.exe --static

      - name: Report linkage and smoke-test
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($exe in @("agent-apropos.exe", "agent-apropos-static.exe")) {
            if (-not (Test-Path $exe)) { Write-Host "== $exe : not produced"; continue }
            Write-Host "== $exe : $((Get-Item $exe).Length) bytes"
            & ".\$exe" --version
            $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $root = & $vswhere -latest -products * -property installationPath
              $dumpbin = Get-ChildItem -Path "$root\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe `
                -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($dumpbin) { & $dumpbin.FullName /DEPENDENTS $exe } else { Write-Host "dumpbin not found" }
            } else { Write-Host "vswhere not found; skipping dependents" }
          }

      - name: Run the spec suite
        continue-on-error: true
        run: crystal spec

      - name: Probe the stdlib primitives the port depends on
        continue-on-error: true
        run: crystal run .github/spike/probe.cr

      # KTD4: the Claude/Codex/Copilot/Gemini emitters write a bare command
      # string. Prove both Windows shells resolve it to the .exe through PATH
      # and PATHEXT, with no `.exe` in the wiring.
      - name: Resolve a bare command name from PowerShell and Git Bash
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path agent-apropos.exe)) { Write-Host "no binary; skipping"; exit 0 }
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item agent-apropos.exe bin\agent-apropos.exe -Force
          $env:PATH = "$PWD\bin;$env:PATH"
          Write-Host "== pwsh, bare name"
          agent-apropos --version
          Write-Host "== pwsh, bare name with a hook payload"
          '{"session_id":"s","tool_name":"Edit","cwd":"' + ($PWD -replace '\\','/') + '","tool_input":{"file_path":"src/app.cr"}}' `
            | agent-apropos hook pre
          Write-Host "== git bash, bare name"
          $posix = ($PWD.Path -replace '\\','/') + "/bin"
          $env:APROPOS_BIN = $posix
          & "C:\Program Files\Git\bin\bash.exe" -c 'PATH="$APROPOS_BIN:$PATH" agent-apropos --version'

      # KTD8: OpenCode's generated plugin spawns an argument array from Bun
      # rather than a shell command, so PATHEXT resolution is not inherited.
      # Answer it against the real runtime instead of assuming.
      - name: Resolve an extensionless name through Bun.spawn
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path bin\agent-apropos.exe)) { Write-Host "no binary; skipping"; exit 0 }
          npm install -g bun 2>&1 | Select-Object -Last 3
          $env:PATH = "$PWD\bin;$env:PATH"
          bun run .github/spike/bun-spawn.js

  # TEMPORARY: the release leg's own steps, verbatim, so `--release --static`,
  # the linkage gate and the install.ps1 self-tests are exercised on a push.
  # The real leg lives in release.yml and only runs on a tag or a dispatch,
  # which this token cannot trigger.
  release-leg:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      ASSET: agent-apropos-windows-x86_64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: 1.20.3

      - name: Build static binary
        run: |
          shards install --production
          crystal build --release --static src/agent_apropos.cr -o $env:ASSET

      # Proves the binary runs on a stock Windows install: every DLL it imports
      # must be present in System32. A third-party dependency (the dynamic
      # build's yaml/pcre2/gc/iconv/libcrypto) would fail this, as would a
      # dynamically linked CRT.
      - name: Verify static linkage
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found; cannot verify linkage" }
          $root = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -Path "$root\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found; cannot verify linkage" }

          $dependents = & $dumpbin.FullName /DEPENDENTS $env:ASSET |
            Select-String -Pattern '^\s+(\S+\.dll)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not $dependents) { throw "dumpbin reported no dependencies; refusing to trust that" }

          $missing = $dependents | Where-Object {
            -not (Test-Path (Join-Path "$env:SystemRoot\System32" $_))
          }
          $dependents | ForEach-Object { Write-Host "  $_" }
          if ($missing) {
            Write-Host "ERROR: these imports are not present on a stock Windows install:"
            $missing | ForEach-Object { Write-Host "  $_" }
            exit 1
          }

      # `&` is required: PowerShell will not treat a variable-derived path as a
      # command name on its own.
      - name: Smoke test
        run: '& ".\$env:ASSET" --version'

      # Same "<hash>  <filename>" format sha256sum(1) writes on the other legs,
      # so install.sh's and install.ps1's verifiers read one shape.
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 $env:ASSET).Hash.ToLowerInvariant()
          Set-Content -Path "$env:ASSET.sha256" -Value "$hash  $env:ASSET" -Encoding ascii

      # Exercises install.ps1's real download/checksum/install logic end-to-end
      # against this leg's own freshly built artifact, with no published release
      # and no networking: the script copies a file:// URI instead of requesting
      # it, so a local directory stands in for GitHub at the same relative path.
      - name: Test install.ps1 against this artifact
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'installer-selftest'
          $serve = Join-Path $work 'serve/NEXL-LTS/agent-apropos/releases/latest/download'
          New-Item -ItemType Directory -Force -Path $serve | Out-Null
          Copy-Item $env:ASSET, "$env:ASSET.sha256" $serve
          $local = Join-Path $work 'install.ps1'
          (Get-Content install.ps1 -Raw).Replace(
            'https://github.com', 'file:///' + ($work -replace '\\','/') + '/serve') |
            Set-Content -Path $local
          $env:AGENT_APROPOS_BIN_DIR = Join-Path $work 'bin'
          & $local
          & (Join-Path $env:AGENT_APROPOS_BIN_DIR 'agent-apropos.exe') --version

      - name: install.ps1 refuses a binary whose checksum does not match
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'installer-tampered'
          $serve = Join-Path $work 'serve/NEXL-LTS/agent-apropos/releases/latest/download'
          New-Item -ItemType Directory -Force -Path $serve | Out-Null
          Copy-Item $env:ASSET, "$env:ASSET.sha256" $serve
          Add-Content -Path (Join-Path $serve $env:ASSET) -Value 'tampered'
          $local = Join-Path $work 'install.ps1'
          (Get-Content install.ps1 -Raw).Replace(
            'https://github.com', 'file:///' + ($work -replace '\\','/') + '/serve') |
            Set-Content -Path $local
          $env:AGENT_APROPOS_BIN_DIR = Join-Path $work 'bin'
          & $local
          if ($LASTEXITCODE -eq 0) { throw "install.ps1 accepted a tampered binary" }
          if (Test-Path (Join-Path $env:AGENT_APROPOS_BIN_DIR 'agent-apropos.exe')) {
            throw "install.ps1 installed a tampered binary"
          }
          Write-Host "refused, as it should: exit $LASTEXITCODE"

      # The version override has to resolve a tagged path rather than
      # /latest/download, which is a different URL shape — worth proving here
      # rather than discovering it from a user report.
      - name: install.ps1 honors the version and install-directory overrides
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'installer-overrides'
          $serve = Join-Path $work 'serve/NEXL-LTS/agent-apropos/releases/download/v9.9.9'
          New-Item -ItemType Directory -Force -Path $serve | Out-Null
          Copy-Item $env:ASSET, "$env:ASSET.sha256" $serve
          $local = Join-Path $work 'install.ps1'
          (Get-Content install.ps1 -Raw).Replace(
            'https://github.com', 'file:///' + ($work -replace '\\','/') + '/serve') |
            Set-Content -Path $local
          $env:AGENT_APROPOS_VERSION = 'v9.9.9'
          $env:AGENT_APROPOS_BIN_DIR = Join-Path $work 'custom-bin'
          & $local
          & (Join-Path $env:AGENT_APROPOS_BIN_DIR 'agent-apropos.exe') --version

